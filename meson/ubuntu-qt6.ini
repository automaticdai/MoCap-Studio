# Meson native file for Ubuntu / Debian, where Qt6 ships no pkg-config files and
# the generic `qmake` resolves to Qt5. Point Meson's Qt6 detection at the Qt6
# tools explicitly:
#
#   meson setup build --native-file meson/ubuntu-qt6.ini
#
# Adjust the paths if your Qt6 lives elsewhere (see `qmake6 -query`).
[binaries]
qmake = '/usr/bin/qmake6'
qmake6 = '/usr/bin/qmake6'
moc = '/usr/lib/qt6/libexec/moc'
uic = '/usr/lib/qt6/libexec/uic'
rcc = '/usr/lib/qt6/libexec/rcc'
