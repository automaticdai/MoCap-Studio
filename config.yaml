capture:
  target_fps: 60
  sync_mode: software
  max_sync_skew_ms: 5
cameras:
  - id: cam0
    type: ip
    url: rtsp://172.30.64.1:8554/cam0
    resolution: [1920, 1080]
pose_estimation:
  backend: onnxruntime
  model: resources/models/rtmpose-m-wholebody.onnx
  device: cpu
  detection_threshold: 0.5
  keypoint_threshold: 0.300000012
triangulation:
  min_views: 2
  ransac_enabled: true
  ransac_threshold_px: 5
  temporal_filter: butterworth
  filter_cutoff_hz: 6
skeleton:
  definition: body_25
  ik_solver: analytical
  joint_limits_enabled: true
gui:
  canvas_fps: 60
  default_render_layers: [grid, markers, skeleton]
  colour_palette: oklab_12